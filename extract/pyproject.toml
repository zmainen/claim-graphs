[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-graphs"
version = "0.1.0"
description = "Claim graphs: induce a typed claim graph from a scientific document, and export it to MIRA, OXA and Discourse Graphs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zach Mainen", email = "zmainen@neuro.fchampalimaud.org" },
]
keywords = ["claim-graph", "claim-extraction", "scientific-publishing", "mira", "discourse-graphs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic[vertex]>=0.40.0",
  "httpx>=0.25",
  "pdfplumber>=0.10",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.1",
]

[project.scripts]
claim-graphs = "claim_graphs.cli:main"

[project.urls]
Homepage = "https://github.com/zmainen/claim-graphs"
Documentation = "https://github.com/zmainen/claim-graphs/tree/main/extract"
Issues = "https://github.com/zmainen/claim-graphs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["claim_graphs*"]

# Note: prompts/ is a sibling of claim_graphs/, not a subdirectory. The
# package finds it at runtime via Path(__file__).parent.parent / "prompts".
# This works for editable installs (pip install -e .) which is the
# Phase A-I development mode. Phase J (publish to shared repo) will
# need a packaging pass — likely moving prompts into claim_graphs/prompts/
# and using importlib.resources for resolution, or shipping prompts as
# data in a wheel via a MANIFEST.in.

[tool.ruff]
line-length = 100
target-version = "py310"
